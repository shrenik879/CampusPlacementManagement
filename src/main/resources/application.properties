spring.application.name=campusPlacementSystem
server.port=8081

# ── Database (MySQL) ───────────────────────────────────────────────────────────
# For local dev: set DB_USERNAME and DB_PASSWORD as environment variables,
# or rely on the defaults (root / root123) which match a typical local MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/campus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Cloudinary ─────────────────────────────────────────────────────────────────
# REQUIRED: Set these environment variables before starting the application.
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# ── Gemini AI ──────────────────────────────────────────────────────────────────
# REQUIRED: Set this environment variable before starting the application.
gemini.api.key=${GEMINI_API_KEY}

# ── Email (Spring Mail) ────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── JWT ────────────────────────────────────────────────────────────────────────
# Dev default provided. REQUIRED in production: set JWT_SECRET to a long random string.
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey}

# ── Frontend URL (for password reset links) ────────────────────────────────────
# Production: set FRONTEND_URL=http://<your-ec2-ip>:3000 (or your domain)
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ── Redis ──────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ── Spring Cache (Redis) ───────────────────────────────────────────────────────
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ── Multipart Upload ───────────────────────────────────────────────────────────
# Allow PDF resumes up to 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging (dev) ─────────────────────────────────────────────────────────────
logging.level.root=DEBUG
logging.level.shrenikcom.example.campusPlacementSystem.config.CacheLogger=DEBUG

# ── SpringDoc / Swagger UI ─────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
# Show only application APIs — exclude Spring Boot internal paths
springdoc.paths-to-exclude=/error