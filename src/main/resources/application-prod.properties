# ── Production Profile ─────────────────────────────────────────────────────────
# Activated with: java -Dspring.profiles.active=prod -jar app.jar
# All secrets are REQUIRED — no defaults are provided.
# Every variable listed here must be set as an environment variable on the server.

# ── Server Port ────────────────────────────────────────────────────────────────
# Render automatically sets PORT. Spring Boot must bind to it.
server.port=${PORT:8081}

# ── Database ───────────────────────────────────────────────────────────────────

# DB_SSL: set to "true" when using a managed MySQL provider that requires SSL (Aiven, PlanetScale, Railway).
# Set to "false" for providers that do not require SSL or for local testing.
# Aiven: set DB_SSL=true AND DB_SSL_VERIFY=false (Aiven uses a self-signed CA by default)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:defaultdb}?useSSL=${DB_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&verifyServerCertificate=${DB_SSL_VERIFY:false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# Use 'update' so Hibernate applies any schema changes safely on Render.
# Switch to 'validate' once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Frontend URL (for password reset links) ────────────────────────────────────
# Set FRONTEND_URL to your Vercel deployment URL.
# Example: https://your-app.vercel.app
frontend.url=${FRONTEND_URL}

# ── Redis ──────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Logging (production) ───────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.shrenikcom.example.campusPlacementSystem=INFO
# Disable cache debug logging in production
logging.level.shrenikcom.example.campusPlacementSystem.config.CacheLogger=WARN
