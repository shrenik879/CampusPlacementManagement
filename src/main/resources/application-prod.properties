# ── Production Profile ─────────────────────────────────────────────────────────
# Activated with: java -Dspring.profiles.active=prod -jar app.jar
# All secrets are REQUIRED — no defaults are provided.
# Every variable listed here must be set as an environment variable on the server.

# ── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/campus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# IMPORTANT: Use 'validate' in production — never allow Hibernate to alter the
# live schema. Run with 'update' ONCE on first boot, then switch to 'validate'.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Redis ──────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Logging (production) ───────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.shrenikcom.example.campusPlacementSystem=INFO
# Disable cache debug logging in production
logging.level.shrenikcom.example.campusPlacementSystem.config.CacheLogger=WARN
